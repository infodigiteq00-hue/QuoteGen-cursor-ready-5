# Railway: install a real Chromium so PDF export does not depend on
# @sparticuz/chromium (that binary is built for AWS Lambda / Amazon Linux).
[phases.setup]
nixPkgs = ["chromium", "nss", "dejavu_fonts"]

[variables]
NODE_VERSION = "22"
PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "true"
# Prefer the Nix Chromium on PATH (set at runtime via findChrome / command -v).
# Never force CLI --print-to-pdf on Railway — it hangs.
PDF_USE_SPAWN = "0"
PDF_TIMEOUT_MS = "45000"
