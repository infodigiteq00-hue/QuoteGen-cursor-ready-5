# Full-fidelity Word/Excel editing — same engine class as Google Docs / Collabora.
# After starting: set ONLYOFFICE_URL=http://localhost:8080 and PUBLIC_API_URL=http://host.docker.internal:3001
#
# Do NOT mount over /etc/onlyoffice/documentserver/local.json — Document Server
# writes DB settings there on first boot. Use scripts/patch-onlyoffice-private-ip.sh
# after the container is healthy so it can fetch files from host.docker.internal.
services:
  onlyoffice:
    image: onlyoffice/documentserver:8.2.2
    ports:
      - "8080:80"
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=dev-onlyoffice-secret
    extra_hosts:
      - "host.docker.internal:host-gateway"
