# Prefer Nixpacks so Railway injects VITE_* env into the Vite build
# (same as before). Dockerfile Chromium path can be re-enabled later.
[build]
builder = "NIXPACKS"

[phases.setup]
nixPkgs = ["chromium", "nss", "dejavu_fonts"]

[variables]
NODE_VERSION = "22"
PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "true"
PDF_USE_SPAWN = "0"
PDF_TIMEOUT_MS = "45000"
