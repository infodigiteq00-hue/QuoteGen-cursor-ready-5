<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QuoteGen — AI quotation engineer</title>
  <link rel="icon" type="image/png" href="/quotegen-mark.png"/>
  <link rel="apple-touch-icon" href="/quotegen-mark.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet"/>
  <style>
    #qg-boot {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Outfit, Inter, system-ui, sans-serif;
      color: #3d4859;
      background: #f5f7fa;
    }
    #qg-boot .qg-boot-inner {
      text-align: center;
    }
    #qg-boot .qg-boot-mark {
      width: 56px;
      height: 56px;
      margin: 0 auto 14px;
      display: block;
      object-fit: contain;
      animation: qgBootMark 1.6s ease-in-out infinite;
      will-change: transform, opacity;
    }
    #qg-boot .qg-boot-title {
      font-weight: 700;
      font-size: 18px;
      letter-spacing: -0.02em;
      color: #1e293b;
    }
    #qg-boot .qg-boot-sub {
      margin-top: 8px;
      font-size: 14px;
      font-family: Inter, system-ui, sans-serif;
      color: #64748b;
      animation: qgBootPulse 1.6s ease-in-out infinite;
    }
    @keyframes qgBootMark {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.06); opacity: 0.88; }
    }
    @keyframes qgBootPulse {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      #qg-boot .qg-boot-mark,
      #qg-boot .qg-boot-sub { animation: none; }
    }
  </style>
</head>
<body>
  <div id="root">
    <div id="qg-boot">
      <div class="qg-boot-inner">
        <img class="qg-boot-mark" src="/quotegen-mark.png" alt="" width="56" height="56"/>
        <div class="qg-boot-title">QuoteGen</div>
        <div class="qg-boot-sub">Loading…</div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
